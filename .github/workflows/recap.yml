name: gazette
on:
  push:
    branches: [main]
    paths: ["posts/**", "site.py", "leagues.json"]
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
concurrency: gazette
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
